name: Build EXE

on:
  push:
    branches:
      - live-wallpaper-app
    paths:
      - 'live-wallpaper/**'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'live-wallpaper/package-lock.json'

      - name: Install dependencies
        working-directory: ./live-wallpaper
        run: npm install

      - name: Build EXE
        working-directory: ./live-wallpaper
        run: npm run build-win

      - name: Upload to Releases
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: live-wallpaper/dist/*.exe
          tag_name: v1.0.0
          name: Live Wallpaper v1.0.0
          body: |
            🎉 Live Wallpaper - готовое приложение!
            
            Просто запусти Live-Wallpaper-portable.exe
            
            ✨ Интерактивный 3D персонаж
            🖱️ Клик для деформации
            👉 Перетащка для вытягивания
            🔄 Вращение камеры
            💡 Управление светом и размером
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
